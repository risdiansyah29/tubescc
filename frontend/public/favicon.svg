<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background: Violet Rounded Square matching FinanceCloud theme -->
  <rect width="448" height="448" x="32" y="32" rx="120" fill="#6366f1" />
  
  <!-- Wallet Body -->
  <path d="M140 180h180c16.5 0 30 13.5 30 30v120c0 16.5-13.5 30-30 30H140c-16.5 0-30-13.5-30-30V210c0-16.5 13.5-30 30-30z" 
        fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Card Slots / Upper fold of the wallet -->
  <path d="M110 230h240" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />
  
  <!-- Clasp on the right side -->
  <path d="M310 230h40a20 20 0 0 1 20 20v24a20 20 0 0 1 -20 20h-40z" 
        fill="#6366f1" stroke="#ffffff" stroke-width="24" stroke-linejoin="round" />
  
  <!-- Clasp Button -->
  <circle cx="345" cy="262" r="10" fill="#ffffff" />
</svg>